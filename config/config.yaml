paths:
  input_dir: input
  model_dir: data/models
  output_dir: output
baseline:
  file: USAM0XXX.AgMIP
  period:
    start: '1980-01-01'
    end: '2009-12-31'
future_periods:
  near:
    start: '2021-01-01'
    end: '2050-12-31'
  mid:
    start: '2041-01-01'
    end: '2070-12-31'
  end:
    start: '2071-01-01'
    end: '2100-12-31'
scenarios:
  ssp126: SSP1-2.6
  ssp245: SSP2-4.5
  ssp370: SSP3-7.0
  ssp460: SSP4-6.0
  ssp585: SSP5-8.5
# Where the model data come from.
#   cmip6  -> discover every file under cmip6.root (layout: <root>/<daily|monthly>/<experiment>/<model>_<var>_lat..._lon..._<start>_<end>.nc)
#   config -> use the hand-written `models:` section below (legacy)
data_source: cmip6
cmip6:
  root: ~/DATA/cmip6/data      # override with --cmip6-root or $PYCSG_CMIP6_ROOT
  resolution: auto             # daily | monthly | auto (daily, falling back to monthly)
  required_variables: [tasmax, tasmin, pr]
  # default_scenarios: [ssp245, ssp585]   # optional; default is every scenario found on disk
variables:
  tasmax: tasmax
  tasmin: tasmin
  pr: pr
member: null
wet_day_threshold_mm: 1.0
gamma_factor: 1.0
method: both
models:
  CCCma - CanESM6-0-MR:
    file: CCCma - CanESM6-0-MR.nc
    historical_experiment: historical
    scenario_experiments:
      ssp126: ssp126
      ssp245: ssp245
      ssp370: ssp370
      ssp585: ssp585
